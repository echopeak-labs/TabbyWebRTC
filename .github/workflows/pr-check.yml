name: PR Check
on:
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: .
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: .
      - run: yarn build
      - run: npx cdk synth --context env=dev --quiet
        env:
          ACM_CERTIFICATE_ARN: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000

  desktop-agent-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/desktop-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components/desktop-agent
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test
